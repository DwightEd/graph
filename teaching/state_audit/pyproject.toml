[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "state-audit"
version = "0.3.1"
description = "A small, reproducible teaching pipeline for language-model state audits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tqdm>=4.66"]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.57.1,<4.58", "sentencepiece>=0.2"]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
state-audit = "state_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
