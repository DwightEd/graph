name: validate-grounded-anchor-flow

on:
  push:
    branches:
      - agent/grounded-anchor-flow
    paths:
      - ".github/workflows/grounded-anchor-flow.yml"

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grounded-anchor-flow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize method implementation
        shell: bash
        run: |
          python .bootstrap/apply_grounded_anchor_flow.py
          rm -f .bootstrap/apply_grounded_anchor_flow.py
          rmdir .bootstrap 2>/dev/null || true
          chmod +x experiments/grounded_anchor_flow/run_all.sh
          python -m compileall -q \
            experiments/attention_mechanism_audit \
            experiments/grounded_anchor_flow
          bash -n experiments/grounded_anchor_flow/run_all.sh
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers numpy scikit-learn pytest
      - name: Test exact messages and global flow
        shell: bash
        run: |
          pytest -q \
            experiments/attention_mechanism_audit/tests \
            experiments/grounded_anchor_flow/tests
      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add source-resolved functional anchor flow"
          git push origin HEAD:agent/grounded-anchor-flow
