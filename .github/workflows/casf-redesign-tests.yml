name: CASF mechanism-guided redesign tests

on:
  push:
    paths:
      - "experiments/causal_setflow/**"
      - "tests/test_causal_setflow*.py"
      - ".github/workflows/casf-redesign-tests.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-learn tqdm
      - name: Compile causal SetFlow package
        run: |
          python -m compileall -q experiments/causal_setflow
          python -m compileall -q tests/test_causal_setflow_memory.py
      - name: Check CLI construction
        run: python -m experiments.causal_setflow.main --help
      - name: Run causal SetFlow tests
        run: python -m unittest discover -s tests -p 'test_causal_setflow*.py' -v
