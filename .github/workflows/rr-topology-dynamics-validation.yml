name: rr-topology-dynamics-validation

on:
  pull_request:
    paths:
      - "experiments/rr_topology_dynamics/**"
      - "experiments/spectral_feasibility/**"
      - "experiments/README.md"
      - "tests/test_rr_topology_dynamics.py"
      - "tests/test_spectral_feasibility.py"
      - "tests/test_research_views.py"
      - "tests/test_experiment_data_contract.py"
      - ".github/workflows/rr-topology-dynamics-validation.yml"

jobs:
  topology-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile modules and validate shell
        run: |
          python -m py_compile \
            experiments/spectral_feasibility/representations.py \
            experiments/rr_topology_dynamics/features.py \
            experiments/rr_topology_dynamics/experiment.py \
            experiments/rr_topology_dynamics/main.py \
            tests/test_rr_topology_dynamics.py
          bash -n experiments/rr_topology_dynamics/run.sh
      - name: Run topology, spectral, and data-contract tests
        run: |
          python -m unittest \
            tests.test_rr_topology_dynamics \
            tests.test_spectral_feasibility \
            tests.test_research_views \
            tests.test_experiment_data_contract -v
