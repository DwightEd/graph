name: Graph structure audit tests

on:
  push:
    paths:
      - "experiments/graph_structure_audit/**"
      - "experiments/source_reuse_contrast/data.py"
      - "research_dataset.py"
      - ".github/workflows/graph-structure-audit-tests.yml"
  pull_request:
    paths:
      - "experiments/graph_structure_audit/**"
      - "experiments/source_reuse_contrast/data.py"
      - "research_dataset.py"
      - ".github/workflows/graph-structure-audit-tests.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-learn tqdm pytest
      - name: Compile package
        run: python -m compileall -q experiments/graph_structure_audit
      - name: Check runner syntax
        run: bash -n experiments/graph_structure_audit/run.sh
      - name: Run graph audit tests
        run: pytest -q experiments/graph_structure_audit/tests
