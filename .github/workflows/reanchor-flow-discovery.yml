name: validate-reanchor-flow-discovery

on:
  push:
    branches:
      - agent/reanchor-flow-discovery
    paths:
      - ".github/workflows/reanchor-flow-discovery.yml"

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reanchor-flow-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize experiment
        shell: bash
        run: |
          python .bootstrap/apply_reanchor_flow.py
          rm -rf .bootstrap
          python -m compileall -q experiments/reanchor_flow
          bash -n experiments/reanchor_flow/run_all.sh
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy matplotlib scipy scikit-learn "transformers>=4.57,<4.58" tqdm pytest
      - name: Run focused tests
        shell: bash
        run: pytest -q experiments/reanchor_flow/tests
      - name: Commit tested experiment
        shell: bash
        run: |
          rm -f .github/workflows/reanchor-flow-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add one-model claim re-anchor flow discovery"
          git push origin HEAD:agent/reanchor-flow-discovery
