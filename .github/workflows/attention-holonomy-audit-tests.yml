name: Attention holonomy audit tests

on:
  push:
    paths:
      - "experiments/attention_holonomy_audit/**"
      - ".github/workflows/attention-holonomy-audit-tests.yml"
  pull_request:
    paths:
      - "experiments/attention_holonomy_audit/**"
      - ".github/workflows/attention-holonomy-audit-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-learn tqdm pytest
      - run: python -m compileall -q experiments/attention_holonomy_audit
      - run: bash -n experiments/attention_holonomy_audit/run.sh
      - run: python -m pytest -q experiments/attention_holonomy_audit/tests
