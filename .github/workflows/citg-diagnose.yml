name: citg-diagnose

on:
  push:
    branches: [causal-isomorphism-trajectory]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Capture CITG validation failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-isomorphism-trajectory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture tests
        run: |
          set +e
          python -m unittest tests.test_causal_isomorphism_trajectory tests.test_experiment_data_contract tests.test_research_views tests.test_conditioned_benchmark -v > citg_ci_failure.log 2>&1
          echo $? > citg_ci_status.txt
          set -e
      - name: Commit diagnostic log
        run: |
          rm -f .github/workflows/citg-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Capture CITG test diagnostics [skip ci]'
          git push origin HEAD:causal-isomorphism-trajectory
