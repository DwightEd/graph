name: CASF memory and fidelity tests

on:
  push:
    paths:
      - "experiments/causal_setflow/**"
      - "tests/test_causal_setflow_memory.py"
      - ".github/workflows/casf-memory-tests.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile CASF package
        run: python -m compileall -q experiments/causal_setflow tests/test_causal_setflow_memory.py
      - name: Run exactness and backward tests
        run: python -m unittest tests.test_causal_setflow_memory -v
