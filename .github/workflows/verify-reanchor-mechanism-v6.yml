name: verify-reanchor-mechanism-v6

on:
  push:
    branches:
      - agent/reanchor-mechanism-v6

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.47.1", "4.57.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy matplotlib scipy scikit-learn tqdm pytest "transformers==${{ matrix.transformers }}"
      - run: |
          python -m compileall -q experiments/common experiments/reanchor_flow
          python -m pytest -q experiments/common/tests/test_llama_message_intervention.py
          python -m pytest -q experiments/reanchor_flow/tests
          bash -n experiments/reanchor_flow/run_all.sh
