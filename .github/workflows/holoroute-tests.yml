name: Graph experiment tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-learn tqdm pytest
      - run: python -m compileall -q experiments/holoroute experiments/grounded_route
      - run: |
          bash -n experiments/holoroute/run.sh
          bash -n experiments/grounded_route/run.sh
      - run: >-
          python -m pytest -q
          experiments/holoroute/tests
          experiments/grounded_route/tests
