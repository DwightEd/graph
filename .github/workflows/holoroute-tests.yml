name: HoloRoute tests

on:
  push:
    branches:
      - main
    paths:
      - "experiments/holoroute/**"
      - ".github/workflows/holoroute-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-learn tqdm pytest
      - run: python -m compileall -q experiments/holoroute
      - run: bash -n experiments/holoroute/run.sh
      - run: pytest -q experiments/holoroute/tests
