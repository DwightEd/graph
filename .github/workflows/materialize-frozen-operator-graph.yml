name: materialize-frozen-operator-graph

on:
  push:
    branches:
      - agent/frozen-operator-graph-one-click
    paths:
      - ".bootstrap/fog.part*"
      - ".github/workflows/materialize-frozen-operator-graph.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frozen-operator-graph-one-click
      - name: Reconstruct exact reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/fog.part* | base64 -d > /tmp/frozen_operator_graph.tar.xz
          echo "a7ad3b60ad126642571f5fb85d7a5f43b93cd7a82d73e40691d99aea191cfc83  /tmp/frozen_operator_graph.tar.xz" | sha256sum -c -
          tar -xJf /tmp/frozen_operator_graph.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-frozen-operator-graph.yml
          python -m compileall -q experiments/frozen_operator_graph
          bash -n experiments/frozen_operator_graph/run_qa.sh
      - name: Run frozen operator graph unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch pytest
          pytest -q experiments/frozen_operator_graph/tests
      - name: Commit exact modular implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add one-click frozen operator graph"
          git push origin HEAD:agent/frozen-operator-graph-one-click
