name: validate-functional-message-graph-refactor

on:
  push:
    branches:
      - agent/functional-message-graph-refactor
    paths:
      - ".github/workflows/functional-message-graph-refactor.yml"

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/functional-message-graph-refactor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize the refactor
        shell: bash
        run: |
          base64 -d .bootstrap/functional_message_graph.tar.gz.b64 > /tmp/functional_message_graph.tar.gz
          rm -rf experiments/attention_mechanism_audit
          tar -xzf /tmp/functional_message_graph.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/functional-message-graph-refactor.yml
          python -m compileall -q experiments/attention_mechanism_audit
          bash -n experiments/attention_mechanism_audit/run_all.sh
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers<5" numpy pytest
      - name: Run the complete mechanism-graph tests
        shell: bash
        run: |
          PYTHONPATH=. pytest -q experiments/attention_mechanism_audit/tests
      - name: Commit the tested refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild audit as a functional message graph"
          git push origin HEAD:agent/functional-message-graph-refactor
