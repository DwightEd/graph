name: validate-fog-direct-oproj-binding

on:
  push:
    branches:
      - agent/fix-fog-direct-oproj-binding
    paths:
      - ".github/workflows/fog-direct-oproj-binding.yml"

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-fog-direct-oproj-binding
      - name: Apply direct o_proj output binding fix
        shell: bash
        run: |
          set -euo pipefail
          python .bootstrap/apply_direct_oproj_fix.py
          rm -f .bootstrap/apply_direct_oproj_fix.py
          rmdir .bootstrap 2>/dev/null || true
          python -m compileall -q experiments/frozen_operator_graph
          bash -n experiments/frozen_operator_graph/run_qa.sh
      - name: Run complete frozen operator graph tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch pytest
          pytest -q experiments/frozen_operator_graph/tests
      - name: Commit tested source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind operator graph to direct o_proj output"
          git push origin HEAD:agent/fix-fog-direct-oproj-binding
