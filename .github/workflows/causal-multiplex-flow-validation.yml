name: causal-multiplex-flow-validation

on:
  pull_request:
    paths:
      - "experiments/causal_multiplex_flow/**"
      - "experiments/README.md"
      - "tests/test_causal_multiplex_flow.py"
      - "tests/test_experiment_data_contract.py"
      - "tests/test_research_views.py"
      - ".github/workflows/causal-multiplex-flow-validation.yml"

jobs:
  cmrp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile modules and validate shell
        run: |
          python -m py_compile \
            experiments/causal_multiplex_flow/events.py \
            experiments/causal_multiplex_flow/controls.py \
            experiments/causal_multiplex_flow/model.py \
            experiments/causal_multiplex_flow/calibration.py \
            experiments/causal_multiplex_flow/artifacts.py \
            experiments/causal_multiplex_flow/experiment.py \
            experiments/causal_multiplex_flow/main.py \
            tests/test_causal_multiplex_flow.py
          bash -n experiments/causal_multiplex_flow/run.sh
      - name: Run CMRP and repository contract tests
        run: |
          python -m unittest \
            tests.test_causal_multiplex_flow \
            tests.test_experiment_data_contract \
            tests.test_research_views -v
