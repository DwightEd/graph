name: citg-fixture-import-fix

on:
  push:
    branches:
      - causal-isomorphism-trajectory

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch CITG fixture import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-isomorphism-trajectory
          fetch-depth: 0
      - name: Replace direct cache import in test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_causal_isomorphism_trajectory.py')
          text = path.read_text()
          old = '''from cache import (\n    AttentionSample,\n    index_row,\n    save_attention_sample,\n    sha256,\n    write_split_index,\n)\n'''
          new = '''import importlib\n\n_cache = importlib.import_module("cache")\nAttentionSample = _cache.AttentionSample\nindex_row = _cache.index_row\nsave_attention_sample = _cache.save_attention_sample\nsha256 = _cache.sha256\nwrite_split_index = _cache.write_split_index\n'''
          if old not in text:
              raise SystemExit('expected cache import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/citg-fixture-import-fix.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix CITG test fixture import [skip ci]'
          git push origin HEAD:causal-isomorphism-trajectory
