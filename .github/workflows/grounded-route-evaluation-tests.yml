name: GroundedRoute tests

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-learn tqdm pytest
      - run: python -m compileall -q experiments/grounded_route
      - run: |
          bash -n experiments/grounded_route/run.sh
          bash -n experiments/grounded_route/evaluation/run.sh
          bash -n experiments/grounded_route/evaluation/run_qa.sh
          bash -n experiments/grounded_route/evaluation/run_controls_qa.sh
      - run: python -m pytest -q experiments/grounded_route/tests experiments/grounded_route/evaluation/tests
