name: validate-functional-message-oom-fix

on:
  push:
    branches:
      - agent/fix-functional-message-oom
    paths:
      - ".github/workflows/functional-message-oom-validation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-functional-message-oom
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers numpy scikit-learn pytest
      - env:
          PYTHONPATH: .
        run: |
          python -m compileall -q experiments/attention_mechanism_audit experiments/grounded_anchor_flow
          bash -n experiments/attention_mechanism_audit/run_all.sh
          bash -n experiments/grounded_anchor_flow/run_all.sh
          pytest -q experiments/attention_mechanism_audit/tests experiments/grounded_anchor_flow/tests
