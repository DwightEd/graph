[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-multiplex"
version = "0.1.0"
description = "Attention-only dynamic multiplex graph construction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.0",
  "tqdm>=4.66",
]

[project.scripts]
attention-multiplex = "attention_multiplex.cli:main"

[tool.setuptools.packages.find]
include = ["attention_multiplex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
